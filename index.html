<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 3D Reality - IMAX Director's Cut</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  


  <style>
    body {
      margin: 0; overflow: hidden; background-color: #010103; color: #e0e0e0;
      font-family: 'Space Grotesk', sans-serif; cursor: crosshair;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Cinematic Vignette Overlay */
    #vignette {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 15;
      background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    /* IMAX Black Bars */
    .cinema-bar { position: absolute; left: 0; width: 100vw; height: 12vh; background: #000; z-index: 20; transition: height 1.5s cubic-bezier(0.87, 0, 0.13, 1); }
    #bar-top { top: 0; } #bar-bottom { bottom: 0; }
    body.immersive .cinema-bar { height: 0vh; }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 50;
      display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s ease;
    }
    #start-screen h2 { font-weight: 300; letter-spacing: 12px; margin-bottom: 10px; color: #fff; font-size: 2.5rem; text-transform: uppercase; }
    #start-screen p { color: #555; letter-spacing: 4px; font-size: 0.9rem; margin-bottom: 50px; }
    #start-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 15px 50px;
      font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase;
      cursor: pointer; transition: all 0.5s; position: relative; overflow: hidden;
    }
    #start-btn:hover { border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,0.1); letter-spacing: 6px; }

    /* Kinetic Typography Subtitles */
    #subtitle-container {
      position: absolute; bottom: 15vh; left: 50%; transform: translateX(-50%); z-index: 30;
      width: 85%; max-width: 900px; text-align: center; pointer-events: none;
    }
    .char { display: inline-block; opacity: 0; transform: translateY(10px); }
    #subtitle-text {
      font-size: 2rem; font-weight: 300; letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.3);
      line-height: 1.4;
    }

    /* Terminal UI */
    #terminal-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 100; display: none; padding: 6vw; box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace; color: #4ade80; font-size: 1.3rem; text-shadow: 0 0 8px #4ade80;
    }
    .term-line { margin-bottom: 15px; white-space: pre-wrap; line-height: 1.6; opacity: 0; transform: translateX(-20px); }
    .sys-error { color: #f87171; text-shadow: 0 0 10px #f87171; font-weight: bold; }
    .sys-highlight { color: #fbbf24; }


    #start-screen { padding: 24px; box-sizing: border-box; text-align: center; }
    #start-btn:disabled { cursor: wait; opacity: 0.55; }
    #startup-status { margin-top: 20px; max-width: 560px; font-size: 0.95rem; line-height: 1.6; color: #999; }
    #retry-btn, .replay-btn { margin-top: 24px; padding: 12px 24px; background: #111; border: 1px solid #4ade80; color: #4ade80; cursor: pointer; font: inherit; }
    #terminal-screen { overflow-y: auto; }
    @media (max-width: 600px) {
      #start-screen h2 { font-size: 1.8rem; letter-spacing: 5px; }
      #start-screen p { letter-spacing: 2px; line-height: 1.8; margin-bottom: 28px; }
      #start-btn { padding: 15px 20px; font-size: 0.9rem; letter-spacing: 2px; }
      #subtitle-text { font-size: 1.35rem; letter-spacing: 0; }
      #terminal-screen { font-size: 0.95rem; }
    }
  </style>


</head>
<body>

  <div id="vignette"></div>
  <div id="bar-top" class="cinema-bar"></div>
  <div id="bar-bottom" class="cinema-bar"></div>

  <div id="start-screen">
    <h2>Spatial Reality</h2>
    <p>A Cinematic Geometric Proof // Wear Headphones</p>
    <button id="start-btn" disabled>Loading Simulation…</button>
    <div id="startup-status" role="status" aria-live="polite">Preparing the 3D engine…</div>
    <button id="retry-btn" hidden>Retry</button>
  </div>

  <div id="subtitle-container"><div id="subtitle-text"></div></div>
  <div id="terminal-screen"></div>
  <div id="canvas-container"></div>

  <script>
    (() => {
      const screen = document.getElementById('start-screen');
      const button = document.getElementById('start-btn');
      const status = document.getElementById('startup-status');
      const retry = document.getElementById('retry-btn');
      let booted = false;
      const watchdog = setTimeout(() => {
        if (!booted) failed(new Error('The 3D engine took too long to load. Please retry.'));
      }, 20000);
      function failed(error) {
        clearTimeout(watchdog);
        console.error('Simulation failed:', error);
        screen.style.display = 'flex';
        screen.style.opacity = '1';
        document.getElementById('terminal-screen').style.display = 'none';
        button.disabled = true;
        button.textContent = 'Simulation Unavailable';
        status.textContent = /webgl|graphics/i.test(String(error && error.message))
          ? '3D graphics are unavailable. Enable hardware acceleration or try another browser, then retry.'
          : 'The simulation could not start. Please reload and try again.';
        status.style.color = '#f87171';
        retry.hidden = false;
      }
      window.simulationUI = {
        failed,
        ready() {
          booted = true;
          clearTimeout(watchdog);
          button.disabled = false;
          button.textContent = 'Initialize Simulation';
          status.textContent = 'Ready — click to begin. Headphones recommended.';
          status.style.color = '#999';
          retry.hidden = true;
        }
      };
      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('error', event => { if (event.error) failed(event.error); });
      window.addEventListener('unhandledrejection', event => failed(event.reason));
      import('./assets/simulation.js').then(module => module.initializeSimulation()).catch(failed);
    })();
  </script>
</body>
</html>
